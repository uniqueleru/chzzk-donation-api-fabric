plugins { id 'fabric-loom' version '1.8.13'; id 'maven-publish' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
test { useJUnitPlatform(); systemProperty 'java.io.tmpdir', System.getenv('TMPDIR') ?: "${buildDir}/tmp" }
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }

// QA-only companion mod: never included in the distributable JAR.
sourceSets {
    example {
        java.srcDirs = ['examples']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        chzzk_donation_api { sourceSet sourceSets.main }
        chzzk_donation_qa { sourceSet sourceSets.qa }
    }
    runs {
        qaServer { server(); source sourceSets.qa; runDir 'run-qa-server' }
        qaClient {
            client(); source sourceSets.qa; runDir 'run-qa-client'
            programArgs '--username', 'DonationTester'
            if (project.hasProperty('qaJoin')) programArgs '--quickPlayMultiplayer', '127.0.0.1:25671'
            else programArgs '--quickPlaySingleplayer', 'qa-world'
        }
    }
}
